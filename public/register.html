<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MOU Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Create account</h2>
    <p class="auth-subtitle">Join the MOU Portal today</p>
    <div id="alert"></div>
    <form id="registerForm">
      <div class="form-group">
        <label>Name Prefix</label>
        <select id="prefix">
          <option value="">Select prefix (optional)</option>
          <option value="Dr.">Dr.</option>
          <option value="Mr.">Mr.</option>
          <option value="Ms.">Ms.</option>
          <option value="Mrs.">Mrs.</option>
        </select>
      </div>
      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Email Address <span class="required">*</span></label>
        <input type="email" id="email" placeholder="you@college.edu" required>
      </div>
      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6">
      </div>
      <div class="form-group">
        <label>I am a <span class="required">*</span></label>
        <select id="role" required onchange="toggleFields()">
          <option value="">Select role</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher / Faculty</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Department</label>
        <input type="text" id="department" placeholder="e.g., Computer Science">
      </div>
      <div class="form-row">
        <div class="form-group" id="studentIdGroup" style="display:none">
          <label>Student ID</label>
          <input type="text" id="studentId" placeholder="CS2021001">
        </div>
        <div class="form-group" id="employeeIdGroup" style="display:none">
          <label>Employee ID</label>
          <input type="text" id="employeeId" placeholder="EMP001">
        </div>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="9876543210">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="auth-link">Already have an account? <a href="login.html">Sign in</a></p>
    <p class="auth-link"><a href="index.html">Back to home</a></p>
  </div>

  <script src="js/common.js"></script>
  <script>
    function toggleFields() {
      const role = document.getElementById('role').value;
      document.getElementById('studentIdGroup').style.display = role === 'student' ? 'block' : 'none';
      document.getElementById('employeeIdGroup').style.display = role === 'teacher' ? 'block' : 'none';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert');
      alertBox.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      const payload = {
        prefix: document.getElementById('prefix').value,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value,
        department: document.getElementById('department').value,
        studentId: document.getElementById('studentId').value,
        employeeId: document.getElementById('employeeId').value,
        phone: document.getElementById('phone').value
      };


      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          alertBox.innerHTML = `<div class="alert alert-error">${data.message}</div>`;
          return;
        }
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        const routes = {
          student: 'student-dashboard.html',
          teacher: 'teacher-dashboard.html',
          admin: 'admin-dashboard.html'
        };
        showToast('Account created! Welcome 🎉', 'success');
        setTimeout(() => window.location.href = routes[data.user.role], 800);
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">Connection error. Please try again.</div>`;
      }
    });
  </script>
</body>
</html>
