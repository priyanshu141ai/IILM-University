<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MOU Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Welcome Back 👋</h2>
    <p class="auth-subtitle">Sign in to your account</p>
    <div id="alert"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address <span class="required">*</span></label>
        <input type="email" id="email" placeholder="you@college.edu" required>
      </div>
      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
    <p class="auth-link"><a href="index.html">← Back to home</a></p>

  </div>

  <script src="js/common.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert');
      alertBox.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          alertBox.innerHTML = `<div class="alert alert-error">${data.message}</div>`;
          return;
        }
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        const routes = {
          student: 'student-dashboard.html',
          teacher: 'teacher-dashboard.html',
          admin: 'admin-dashboard.html'
        };
        window.location.href = routes[data.user.role] || 'index.html';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-error">Connection error. Please try again.</div>`;
      }
    });
  </script>
</body>
</html>
